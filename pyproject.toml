[project]
name = "synapserag-mcp"
version = "0.1.0"
description = "A modular RAG MCP server with pluggable ingestion, retrieval, and observability layers."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests that isolate a single module",
    "integration: tests that verify multiple modules working together",
    "e2e: end-to-end tests that exercise user workflows",
]
