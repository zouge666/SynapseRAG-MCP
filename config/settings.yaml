app:
  name: synapserag-mcp
  environment: local

llm:
  provider: openai
  model: gpt-4o

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

vector_store:
  backend: chroma
  persist_path: data/db/chroma
  collection: default

splitter:
  provider: recursive
  chunk_size: 1000
  chunk_overlap: 200

retrieval:
  sparse_backend: bm25
  fusion_algorithm: rrf
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 5

rerank:
  enabled: false
  backend: none
  model: ""
  top_m: 30

evaluation:
  enabled: false
  backends:
    - custom_metrics

observability:
  log_path: logs/app.log
  trace_path: logs/traces.jsonl
